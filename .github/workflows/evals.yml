name: Skill Validation and Evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
          - trigger
          - behavior
          - independent
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: python tests/validate_package.py
      - name: Validate eval registry
        run: python evals/run_evals.py --validate-only

  live-smoke:
    name: Live smoke eval
    needs: deterministic
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_PROVIDER: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API key status
        if: ${{ env.DEEPSEEK_API_KEY == '' && env.OPENAI_API_KEY == '' }}
        run: echo "No DEEPSEEK_API_KEY or OPENAI_API_KEY is configured; live smoke eval skipped."
      - name: Install eval dependency
        if: ${{ env.DEEPSEEK_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python -m pip install --upgrade openai
      - name: Run smoke eval
        if: ${{ env.DEEPSEEK_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python evals/run_evals.py --suite smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-eval-smoke-${{ github.sha }}
          path: eval-results/
          if-no-files-found: ignore

  live-full:
    name: Live full eval
    needs: deterministic
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.head_ref == 'full-eval-v106') }}
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_PROVIDER: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API key status
        if: ${{ env.DEEPSEEK_API_KEY == '' && env.OPENAI_API_KEY == '' }}
        run: echo "No DEEPSEEK_API_KEY or OPENAI_API_KEY is configured; live full eval skipped."
      - name: Install eval dependency
        if: ${{ env.DEEPSEEK_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python -m pip install --upgrade openai
      - name: Run selected eval suite
        if: ${{ env.DEEPSEEK_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python evals/run_evals.py --suite "${{ github.event.inputs.suite || 'full' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-eval-full-${{ github.sha }}
          path: eval-results/
          if-no-files-found: ignore
